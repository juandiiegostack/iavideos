audio:
  sample_rate: 16000
  frame_ms: 64
  hop_ms: 32
  db_floor: -60
  quiet_db: -42
  scream_band_hz: [2500, 7500]
  laughter_band_hz: [3, 9]
  # Weight of the "sudden loudness" novelty component.
  novelty: 0.35
  scream: 0.15
  laughter: 0.10

transcript:
  model: small
  device: auto           # auto | cpu | cuda
  compute_type: auto     # auto | int8 | int8_float16 | float16 | float32
  language: null         # null = autodetect, or "es", "en"...
