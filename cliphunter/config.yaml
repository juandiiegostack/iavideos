scoring:
  peak_threshold: 0.42       # normalized score needed to consider a peak
  relative_threshold: 0.35   # fallback: fraction of the highest peak
  min_peak_distance: 12.0    # seconds between separate peaks
  merge_distance: 8.0        # peaks closer than this are merged
  max_overlap: 0.0           # 0.0 = clips may not overlap at all
  smoothing_frames: 2
  low_percentile: 10
  high_percentile: 95

selection:
  clips: 10
  min_duration: 15.0
  max_duration: 60.0
  pre_roll: 8.0
  post_roll: 4.0
  silence_snap: 3.0

export:
  codec: libx264
  preset: veryfast
  crf: 20
  audio_bitrate: 192k
  workers: 2
  vertical: false
  vertical_mode: blur        # blur | crop
  vertical_blur: 28
  vertical_brightness: -0.06
  max_width: 1920

subtitles:
  enabled: false
  mode: word                # word | chunk
  font: Arial Black
  font_size_horizontal: 56
  font_size_vertical: 104
  margin_v_horizontal: 40
  margin_v_vertical: 340
  max_words: 4
  max_chars: 30
  max_duration: 3.0
  highlight_color: "&H00FFFF&"   # ASS BGR: yellow
  outline: 7
  shadow: 2
  bold: true

llm:
  enabled: false
  # Any OpenAI-compatible endpoint. Values are overridden by env vars:
  # CLIPHUNTER_LLM_BASE_URL, CLIPHUNTER_LLM_API_KEY, CLIPHUNTER_LLM_MODEL
  base_url: ""
  api_key: ""
  model: ""
  timeout: 60
  temperature: 0.4
  weight: 0.30              # blend with heuristic score (0 = ignore LLM ranking)
  max_candidates: 12

paths:
  cache_dir: null           # null = OS cache dir (LOCALAPPDATA or ~/.cache)
  output_dir: clips
