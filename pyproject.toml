[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cliphunter"
version = "0.1.0"
description = "Detecta los mejores momentos de un VOD o directo y exporta clips listos para publicar."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ClipHunter" }]
keywords = ["twitch", "youtube", "kick", "clips", "vod", "live", "whisper", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2025.1.1",
    "streamlink>=7.0.0",
    "numpy>=1.26",
    "rich>=13.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "chat-downloader>=0.2.8",
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cliphunter = "cliphunter.cli:main"

[tool.setuptools]
packages = ["cliphunter", "cliphunter.signals"]
include-package-data = true

[tool.setuptools.package-data]
cliphunter = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
